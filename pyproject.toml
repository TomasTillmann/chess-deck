[project]
name = "woodpecker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28.0",
    "python-chess>=1.999",
    "typer>=0.26.8",
]

[project.scripts]
woodpecker = "woodpecker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsers/woodpecker"]
