services:
  server:
    build:
      context: ./server
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: /data/woodpecker.sqlite
    ports:
      - "3001:3001"
    volumes:
      - ./server/data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3001/healthcheck').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  ui:
    build:
      context: ./ui
      target: dev
      args:
        VITE_SERVER_URL: http://localhost:3001
    environment:
      VITE_SERVER_URL: http://localhost:3001
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:5173"
    volumes:
      - ./ui/src:/app/src
      - ./ui/index.html:/app/index.html
      - ./ui/vite.config.ts:/app/vite.config.ts
      - ./ui/tsconfig.json:/app/tsconfig.json
      - ./ui/tsconfig.node.json:/app/tsconfig.node.json
    develop:
      watch:
        - action: rebuild
          path: ./ui/package.json
        - action: rebuild
          path: ./ui/package-lock.json
        - action: rebuild
          path: ./ui/Dockerfile
