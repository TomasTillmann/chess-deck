[project]
name = "woodpecker-solver"
version = "0.1.0"
description = "Parallel Stockfish solver for Woodpecker FEN collections."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-chess>=1.999",
    "typer>=0.26.8",
]

[project.scripts]
solve-fens = "woodpecker_solver.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/woodpecker_solver"]
